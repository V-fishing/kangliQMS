name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: qms-web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: qms-web
        run: pnpm install --frozen-lockfile

      - name: Lint (含术语检查)
        working-directory: qms-web
        run: pnpm lint:check

      - name: Stylelint
        working-directory: qms-web
        run: pnpm lint:style

      - name: Type check
        working-directory: qms-web
        run: pnpm type-check

      - name: Unit tests
        working-directory: qms-web
        run: pnpm test:cov

      - name: Build
        working-directory: qms-web
        run: pnpm build:only

      - name: 术语检查复扫 locale
        working-directory: qms-web
        run: pnpm lint:check -- --rule 'qms-term/no-forbidden-term: error' src/locales/
